<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Attention Lab, in the Lab at ryankm.com">
  <!-- The share card: the same picture the Lab's shelf card runs, held still.
       A wireframe being read, heat where the eye rested, straight saccades
       between. Site tokens. The three typefaces are the site's (Hanken Grotesk,
       Source Serif 4, JetBrains Mono), so export it in a browser that has
       public/fonts loaded, or the text falls back to system faces.

       This is the editable source. What ships is public/opengraph.png, exported
       from here at 1200x630; this file lives outside public/ so the deploy only
       carries files the page actually references. Re-export after editing. -->
  <rect width="1200" height="630" fill="#faf9f5"/>

  <defs>
    <radialGradient id="heat">
      <stop offset="0" stop-color="#e73d00" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#e73d00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- The screen under test -->
  <g stroke="#d1cfc5" stroke-width="2" fill="none">
    <rect x="620" y="120" width="440" height="390"/>
    <path d="M660 190 H860"/>
    <path d="M660 330 H840 M660 358 H800 M660 386 H820"/>
    <rect x="880" y="220" width="140" height="120"/>
    <rect x="850" y="420" width="120" height="52"/>
  </g>

  <!-- Where the eye rested, sized by how long it stayed -->
  <g>
    <circle cx="700" cy="190" r="78" fill="url(#heat)"/>
    <circle cx="950" cy="280" r="96" fill="url(#heat)"/>
    <circle cx="700" cy="330" r="66" fill="url(#heat)"/>
    <circle cx="710" cy="386" r="58" fill="url(#heat)"/>
    <circle cx="910" cy="446" r="104" fill="url(#heat)"/>
  </g>

  <!-- The scanpath: straight legs, because that is what a saccade is -->
  <polyline points="700,190 950,280 700,330 710,386 910,446"
            fill="none" stroke="#141413" stroke-width="3"/>
  <circle cx="910" cy="446" r="8" fill="#141413"/>

  <!-- The label voice, then the title, then the claim in the reading serif -->
  <text x="90" y="176" fill="#5e5d59" font-family="'JetBrains Mono', ui-monospace, monospace"
        font-size="20" font-weight="400" letter-spacing="1.4">TOOL · THE LAB</text>
  <text x="87" y="296" fill="#141413" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif"
        font-size="84" font-weight="600" letter-spacing="-2.1">Attention Lab</text>
  <text x="90" y="358" fill="#3d3d3a" font-family="'Source Serif 4', ui-serif, Georgia, serif"
        font-size="27" font-weight="400">Webcam eye tracking for wireframes.</text>
  <text x="90" y="398" fill="#3d3d3a" font-family="'Source Serif 4', ui-serif, Georgia, serif"
        font-size="27" font-weight="400">Nothing leaves the machine it runs on.</text>

  <text x="90" y="540" fill="#141413" font-family="'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif"
        font-size="21" font-weight="700" letter-spacing="3.4">RYAN MCCARTY</text>
</svg>
